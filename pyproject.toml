[project]
name = "playwright-framework"
version = "0.1.0"
description = "Python Playwright automation framework"
requires-python = ">=3.11"

dependencies = [
    "pytest",
    "playwright",
    "pyyaml",
    "pydantic",
    "requests"
]

[tool.pytest.ini_options]
markers = [
    "sanity: All critical path tests",
    "regression: All standard test cases",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short --alluredir=./allure-results"